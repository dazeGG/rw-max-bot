# Сервер: PostgreSQL, API, бот и Caddy. Наружу открыты только 80 и 443 (Caddy).
# Переменные — из /opt/rw-max-bot/.env (шаблон: deploy/.env.example), см. deploy/README.md

name: rw-max-bot

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: rw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: rw_max_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'rw', '-d', 'rw_max_bot']
      interval: 5s
      retries: 12

  api:
    build:
      context: ..
      target: api
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Запрещает pnpm db:seed --force: на сервере он стер бы правки из админки
      NODE_ENV: production
      DATABASE_URL: postgres://rw:${POSTGRES_PASSWORD}@postgres:5432/rw_max_bot
      API_HOST: 0.0.0.0
      API_PORT: 3001
      BOT_CONTROL_URL: http://bot:3002
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      ADMIN_COOKIE_SECURE: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - logs:/app/logs

  bot:
    build:
      context: ..
      target: bot
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?}
      BOT_MODE: webhook
      WEBHOOK_DOMAIN: https://${DOMAIN:?}
      WEBHOOK_PATH: /webhook
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?}
      PORT: 3000
      API_URL: http://api:3001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      CONTENT_REFRESH_SECONDS: ${CONTENT_REFRESH_SECONDS:-300}
      BOT_CONTROL_HOST: 0.0.0.0
      BOT_CONTROL_PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      E5_CACHE_DIR: /models
      RERANK_DEPTH: ${RERANK_DEPTH:-10}
      RERANK_THRESHOLD: ${RERANK_THRESHOLD:-}
      RERANK_AMBIGUITY_GAP: ${RERANK_AMBIGUITY_GAP:-}
      RERANK_CLARIFY_THRESHOLD: ${RERANK_CLARIFY_THRESHOLD:-}
      RERANK_E5_WEIGHT: ${RERANK_E5_WEIGHT:-}
      E5_OPTION_THRESHOLD: ${E5_OPTION_THRESHOLD:-}
      E5_OPTION_GAP: ${E5_OPTION_GAP:-}
    # E5 + реранкер занимают ~1.7 ГБ; при превышении перезапускается бот, а не страдает весь сервер
    mem_limit: 2500m
    volumes:
      - logs:/app/logs
      - models:/models

  web:
    build:
      context: ..
      target: web
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
      - bot
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  logs:
  models:
  caddy_data:
  caddy_config:
